# Dokploy/Traefik termina HTTPS. No se publica un puerto directo de este proxy.
map $http_x_forwarded_proto $protocolo_original {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # DNS de Docker: permite encontrar el backend después de un reinicio.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django http://backend:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass $django;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $protocolo_original;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_connect_timeout 10s;
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_buffering off;
        gzip off;
    }

    location /static/ {
        alias /usr/share/nginx/django-static/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    # Mantiene /login, /chat y /administrador al entrar o recargar directamente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
